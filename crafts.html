<!DOCTYPE html>
<html>
<head>
    <title>Choose an Item | RePurpose</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 class= "crafts-line">Choose an item:</h2>

    <button data-file="pizza-box.json">Pizza Box</button>
    <button data-file="popsicle-sticks.json">Popsicle Sticks</button>

    <button data-file="plastic-bag.json">Plastic Bag</button>
    <button data-file="soda-can.json">Soda Can</button>
    <button data-file="straws.json">Straws</button>
    <button data-file="tin-can.json">Tin Can</button>
    <button data-file="cardboard.json">Cardboard</button>
    <button data-file="paper.json">Paper</button>
    <button data-file="bangle.json">Bangles</button>
    <button data-file="toilet-paper-rolls.json">Toilet Paper Rolls</button>

<div id="craft-results"></div>
<script src="script.js"></script>

</html>
